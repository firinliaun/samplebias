[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "firinliaun-samplebias"
version = "0.1.0"
description = "比较目标分布与实际采样分布，按来源算出加权偏差"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "firinliaun" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://firinliaun.github.io"
Repository = "https://github.com/firinliaun/samplebias"
Issues = "https://github.com/firinliaun/samplebias/issues"

[project.scripts]
samplebias = "samplebias:main"

[tool.setuptools]
py-modules = ["samplebias"]
